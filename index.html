<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OWL DLP — Вход</title>

  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <main class="auth-page">
    <div class="auth-card">

      <img src="assets/logo.png" class="logo" alt="OWL DLP">

      <h1>OWL DLP</h1>
      <p class="subtitle">
        Веб-приложение для контроля утечки конфиденциальной информации
      </p>

      <div class="form-group">
        <input type="text" id="fullName" placeholder="ФИО">
        <input type="email" id="email" placeholder="Email">
        <input type="password" id="password" placeholder="Пароль">
      </div>

      <div class="buttons">
        <button id="registerBtn" type="button">Регистрация</button>
        <button id="loginBtn" type="button" class="secondary-btn">Войти</button>
      </div>

      <p id="message"></p>

    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
