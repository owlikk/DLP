<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OWL DLP — Панель анализа</title>
  <link rel="stylesheet" href="css/style.css?v=7">
</head>
<body>

  <main class="dashboard-page">
    <div class="dashboard-card">

      <div class="top-bar">
        <img src="assets/logo.png" class="dashboard-logo" alt="OWL DLP">

        <div>
          <h1>OWL DLP</h1>
          <p>Контроль утечки конфиденциальной информации</p>
        </div>
      </div>

      <textarea
        id="messageInput"
        placeholder="Вставьте текст письма, сообщения или данные для анализа..."
      ></textarea>

      <div class="dashboard-buttons">
        <button id="analyzeBtn">Проверить текст</button>
        <button id="maskBtn">Замаскировать</button>
        <button id="clipboardBtn" class="secondary-btn">Буфер обмена</button>
        <button onclick="window.location.href='education.html'" class="secondary-btn">Обучение</button>
        <button onclick="window.location.href='admin.html'" class="secondary-btn">Админка</button>
        <button id="logoutBtn" class="secondary-btn">Выйти</button>
      </div>

      <div class="result-box">
        <h3>Результат анализа</h3>
        <p id="riskLevel">Риск: —</p>
        <p id="riskScore">Оценка: —</p>
        <div id="foundItems"></div>
      </div>

      <div class="result-box" style="margin-top:20px;">
        <h3>Замаскированный текст</h3>
        <textarea id="maskedOutput" readonly></textarea>
      </div>

    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/analyzer.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
