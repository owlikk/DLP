<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OWL DLP — Обучение</title>
  <link rel="stylesheet" href="css/style.css?v=8">
</head>
<body>

  <main class="dashboard-page">
    <div class="dashboard-card">

      <div class="top-bar">
        <img src="assets/logo.png" class="dashboard-logo" alt="OWL DLP">
        <div>
          <h1>Обучение сотрудников</h1>
          <p>Тест по безопасной работе с электронной почтой и социальными сетями</p>
        </div>
      </div>

      <div class="result-box">
        <h3>Тестирование</h3>
        <p>Система случайно выбирает 10 вопросов из 50. Вопросы не повторяются.</p>
        <div id="quizContainer"></div>
        <button id="finishTestBtn">Завершить тест</button>
        <p id="testResult"></p>
      </div>

      <div class="dashboard-buttons" style="margin-top:20px;">
        <button onclick="window.location.href='dashboard.html'">Назад</button>
      </div>

    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/education.js"></script>
</body>
</html>
